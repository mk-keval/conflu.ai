site_name: conflu.ai Documentation
site_description: Professional Multi-Asset Trading Platform
site_author: conflu.ai Team
site_url: https://keval.github.io/conflu.ai/

repo_name: keval/conflu.ai
repo_url: https://github.com/keval/conflu.ai

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [backend]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
  - gen-files:
      scripts:
        - docs/scripts/gen_api_ref.py
  - literate-nav:
      nav_file: NAV.md
  - section-index
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/keval/conflu.ai

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Screener: user-guide/screener.md
      - Backtesting: user-guide/backtest.md
      - Risk Management: user-guide/risk.md
      - Alerts: user-guide/alerts.md
  - API Reference: api/
  - Architecture: architecture.md
  - Developer Guide:
      - Contributing: dev-guide/contributing.md
      - Local Setup: dev-guide/local-setup.md
      - Coding Standards: dev-guide/coding-standards.md
      - Debugging: dev-guide/debugging.md
  - Decisions: decisions/
  - Changelog: changelog.md
