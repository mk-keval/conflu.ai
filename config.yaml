core:
  duckdb_path: data/conflu.duckdb
  duckdb_data_dir: data
  log_level: INFO
  log_json: true

data:
  screener_sources:
    - america
    - crypto
    - forex
    - futures
  timeframes:
    - 1m
    - 5m
    - 15m
    - 1h
    - 4h
    - 1D
  assets:
    equities:
      - SPY
      - QQQ
      - AAPL
      - MSFT
      - GOOGL
      - AMZN
      - NVDA
      - META
      - TSLA
      - JPM
    crypto:
      - BTCUSDT
      - ETHUSDT
      - BNBUSDT
      - SOLUSDT
      - XRPUSDT
    forex:
      - EURUSD
      - GBPUSD
      - USDJPY
      - AUDUSD
      - USDCAD
    commodities:
      - GC1!
      - CL1!
      - SI1!
      - HG1!
    indices:
      - SPX
      - NDX
      - DJI
  max_concurrent: 50
  batch_size: 100
  exchange_prefixes:
    equities: "NASDAQ:"
    crypto: "BINANCE:"
    forex: "FX:"
    commodities: "COMEX:"
    indices: "SP:"
  asset_class_markets:
    equities: "america"
    crypto: "crypto"
    forex: "forex"
    commodities: "futures"
    indices: "america"
  asset_class_timezones:
    equities: "America/New_York"
    crypto: "UTC"
    forex: "UTC"
    commodities: "America/New_York"
    indices: "America/New_York"
  symbol_exchange_overrides:
    SPY: "AMEX:"
  tv_session_id: ""

ingestion:
  retry_max_attempts: 3
  retry_base_delay_s: 1.0
  retry_max_delay_s: 30.0
  retry_backoff_factor: 2.0
  retry_jitter: 0.1
  circuit_breaker_threshold: 5
  circuit_breaker_cooldown_s: 30.0
  daily_schedule_utc: "00:00"
  intraday_interval_s: 300

compute:
  default_indicator_timeframe: 1D
  cache_indicators: true
  broadcast_indicators:
    - rsi
    - macd
    - ema
    - sma
    - atr
  cached_indicators:
    - rsi
    - macd
    - ema
    - sma
    - atr
    - adx
    - obv
    - bb
    - vwap
    - stoch
  indicator_cache_enabled: true
  screen_default_timeframes:
    - 1D
    - 4h
    - 1h

screen:
  screens_dir: config/screens
  screener_ws_path: /api/v1/ws/screener/{screen_id}
  stream_interval_s: 5.0
  max_history: 100
  top_down_narrowing: true
  parallel_asset_classes: 5

backtest:
  default_timeframe: 1D
  default_position_sizing: fixed
  default_fees_bps: 10.0
  default_slippage_bps: 5.0
  default_initial_cash: 100000.0
  default_min_train_bars: 252
  default_train_pct: 0.7
  cache_results: true
  max_symbols_per_run: 50
  parallel_symbols: 4

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:5173
  rate_limit: 100

frontend:
  ws_endpoint: ws://localhost:8000/ws
  chart_config:
    default_timeframe: 1D
    indicators:
      - RSI
      - MACD
      - EMA_20
      - EMA_50
      - BB
