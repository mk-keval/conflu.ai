core:
  duckdb_path: data/conflu.duckdb
  duckdb_data_dir: data
  log_level: INFO
  log_json: true

data:
  screener_sources:
    - america
    - crypto
    - forex
    - futures
  timeframes:
    - 1m
    - 5m
    - 15m
    - 1h
    - 4h
    - 1D
  assets:
    equities:
      - SPY
      - QQQ
      - AAPL
      - MSFT
      - GOOGL
      - AMZN
      - NVDA
      - META
      - TSLA
      - JPM
    crypto:
      - BTCUSDT
      - ETHUSDT
      - BNBUSDT
      - SOLUSDT
      - XRPUSDT
    forex:
      - EURUSD
      - GBPUSD
      - USDJPY
      - AUDUSD
      - USDCAD
    commodities:
      - GC1!
      - CL1!
      - SI1!
      - HG1!
    indices:
      - SPX
      - NDX
      - DJI
  max_concurrent: 50
  batch_size: 100
  exchange_prefixes:
    equities: "NASDAQ:"
    crypto: "BINANCE:"
    forex: "FX:"
    commodities: "COMEX:"
    indices: "SP:"
  asset_class_markets:
    equities: "america"
    crypto: "crypto"
    forex: "forex"
    commodities: "futures"
    indices: "america"
  asset_class_timezones:
    equities: "America/New_York"
    crypto: "UTC"
    forex: "UTC"
    commodities: "America/New_York"
    indices: "America/New_York"
  symbol_exchange_overrides:
    SPY: "AMEX:"
  tv_session_id: ""

ingestion:
  retry_max_attempts: 3
  retry_base_delay_s: 1.0
  retry_max_delay_s: 30.0
  retry_backoff_factor: 2.0
  retry_jitter: 0.1
  circuit_breaker_threshold: 5
  circuit_breaker_cooldown_s: 30.0
  daily_schedule_utc: "00:00"
  intraday_interval_s: 300

compute:
  default_indicator_timeframe: 1D
  cache_indicators: true
  broadcast_indicators:
    - rsi
    - macd
    - ema
    - sma
    - atr
  screen_default_timeframes:
    - 1D
    - 4h
    - 1h

screen:
  screens_dir: config/screens
  screener_ws_path: /api/v1/ws/screener/{screen_id}
  stream_interval_s: 5.0
  max_history: 100
  top_down_narrowing: true
  parallel_asset_classes: 5

backtest:
  default_timeframe: 1D
  default_position_sizing: fixed
  default_fees_bps: 10.0
  default_slippage_bps: 5.0
  default_initial_cash: 100000.0
  default_min_train_bars: 252
  default_train_pct: 0.7
  cache_results: true
  max_symbols_per_run: 50
  parallel_symbols: 4

  optimization:
    enabled: false
    default_method: bayesian
    max_trials: 100
    timeout_s: 300
    n_jobs: 4
    early_stopping: true
    min_improvement: 0.01
    multi_objective: false
    objective_metrics:
      - sharpe
      - sortino
      - calmar
      - max_dd
      - win_rate
    default_objective: sharpe
    optuna_storage: sqlite
    optuna_storage_path: data/optuna_studies.db

  regime_detection:
    enabled: false
    default_method: hmm
    hmm_n_states: 3
    hmm_window_days: 252
    hmm_n_iter: 100
    vol_quantile_buckets: 4
    vol_window_days: 21
    regime_features:
      - returns
      - volatility

  reporting:
    enabled: false
    default_formats:
      - html
      - json
    templates_dir: config/report_templates
    default_template: backtest_report.html
    include_equity_curve: true
    include_drawdown: true
    include_trade_analysis: true
    include_regime_analysis: false
    include_parameter_sensitivity: true
    max_chart_points: 5000

  comparison:
    enabled: false
    max_strategies: 10
    significance_level: 0.05
    bootstrap_samples: 1000

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:5173
    - http://localhost:3000
  rate_limit: 100
  rate_limit_screener: 30
  rate_limit_backtest: 10
  rate_limit_data: 200
  rate_limit_ws: 10
  api_keys: []
  jwt_secret: ""
  jwt_algorithm: HS256
  jwt_expire_minutes: 60
  cors_allow_credentials: true
  cors_allow_methods: ["*"]
  cors_allow_headers: ["*"]
  otel_service_name: "conflu-api"
  otel_exporter_otlp_endpoint: ""
  prometheus_enabled: true
  log_request_body: false
  health_db_timeout_s: 5.0
  ws_max_connections: 1000
  ws_ping_interval_s: 30.0
  ws_pong_timeout_s: 10.0

frontend:
  ws_endpoint: ws://localhost:8000/ws
  chart_config:
    default_timeframe: 1D
    indicators:
      - RSI
      - MACD
      - EMA_20
      - EMA_50
      - BB

risk:
  default_risk_per_trade: 0.01
  default_atr_multiplier: 2.0
  beta_window_days: 60
  beta_benchmark_map:
    equities: SPY
    crypto: BTCUSDT
    forex: EURUSD
    commodities: GC1!
    indices: SPX
  correlation_window_days: 30
  var_confidence_levels:
    - 0.95
    - 0.99
  var_horizon_days:
    - 1
    - 10
  var_methods:
    - historical
    - parametric
    - monte_carlo
  var_monte_carlo_paths: 10000
  default_kelly_fraction: 0.5
  max_dd_target: 0.25
  risk_ws_path: /api/v1/ws/risk/{portfolio_id}
  report_max_symbols: 50
  cache_risk_results: true
  max_correlation_symbols: 100
