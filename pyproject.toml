[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conflu-ai"
version = "0.1.0"
description = "Professional Multi-Asset Trading Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings[yaml]>=2.0,<3",
    "duckdb>=0.10.0",
    "vectorbt>=0.40.0",
    "pandas-ta>=0.3.14",
    "pandas>=2.0,<3",
    "structlog>=24.1,<25",
    "numpy>=1.26",
    "scipy>=1.11,<2",
    "pyyaml>=6.0",
    "tradingview-screener>=3.2,<4",
    "httpx>=0.27,<1",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "prometheus-fastapi-instrumentator>=7.0,<8",
    "celery>=5.3,<6",
    "redis>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "pre-commit>=3.6",
    "pytest-httpx>=0.30",
    "jinja2>=3.1,<4",
    "matplotlib>=3.7,<4",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "websockets>=12.0",
    "httpx>=0.27",
]
observability = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.50b",
    "opentelemetry-exporter-otlp>=1.25",
]

[tool.mypy]
strict = false
disallow_untyped_defs = false
warn_return_any = false
no_implicit_optional = false
check_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = false
warn_unused_configs = false
warn_unreachable = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas_ta.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "duckdb.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tradingview_screener.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "starlette.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prometheus_fastapi_instrumentator.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prometheus_client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vectorbt*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "optuna*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "celery*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic_settings*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic_core*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "celery*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "weasyprint*"
ignore_missing_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dateparser*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jedi*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llvmlite*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numba*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "click*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "**/tests/**",
    "**/test_*.py",
    "**/worker/**",
]

[tool.setuptools]
packages = {find = {where = ["backend"]}}

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4"]
ignore = ["E501", "F401", "F841", "ARG001", "ARG002", "B007", "W293", "SIM105", "SIM108", "C416", "UP017", "UP035", "N806", "B007", "F841", "ARG004", "B905", "SIM114", "N811", "B905", "W292", "F811", "C420", "SIM102", "I001", "F541", "UP035", "N806", "N811", "B007", "W292", "ARG003", "F402", "UP037", "F402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
