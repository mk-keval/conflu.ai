name: "Short Squeeze"
description: "Potential short squeeze — rising price on heavy volume above VWAP with bearish analyst sentiment"
asset_classes:
  - equities
timeframes:
  - 1D
  - 4h
filters:
  - category: momentum
    indicator: rsi_overbought
    params:
      threshold: 50
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "1D"
  - category: volume
    indicator: price_above_vwap
    timeframe: "1D"
  - category: trend
    indicator: price_above_ema
    params:
      period: 20
    timeframe: "1D"
