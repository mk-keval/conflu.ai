name: "Bull Flag Continuation"
description: "Stocks that were going up, paused to catch their breath (tight consolidation), and look ready to continue higher. Think of it as a runner resting before the next sprint. Great for catching the second leg of a move."
direction: long
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
filters:
  # Institutional quality gates
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 500000000
    timeframe: "1D"
  - category: fundamental
    indicator: exchange_in
    params:
      exchanges:
        - "NYSE"
        - "NASDAQ"
    timeframe: "1D"
  - category: fundamental
    indicator: country_in
    params:
      countries:
        - "United States"
    timeframe: "1D"
  - category: fundamental
    indicator: close_above
    params:
      threshold: 5.0
    timeframe: "1D"
  - category: volume
    indicator: avg_volume_gt
    params:
      threshold: 500000
    timeframe: "1D"
  - category: volume
    indicator: volume_gt
    params:
      threshold: 500000
    timeframe: "1D"
  # Technical bull flag criteria
  - category: trend
    indicator: ema_stack_bullish
    timeframe: "1D"
  - category: trend
    indicator: price_above_ema
    params:
      period: 20
    timeframe: "1D"
  - category: momentum
    indicator: macd_bullish
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.2
    timeframe: "4h"
  - category: volatility
    indicator: bb_squeeze
    params:
      threshold: 1.05
    timeframe: "1D"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 20
    timeframe: "1D"
  - category: volume
    indicator: price_above_vwap
    timeframe: "1D"
