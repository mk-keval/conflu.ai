name: "Trend Leader"
description: "Strong trending stocks with aligned EMAs, RSI momentum sweet spot, MACD bullish, and volume confirmation — ideal for riding institutional trend flows"
direction: long
asset_classes:
  - equities
timeframes:
  - 1D
  - 4h
filters:
  - category: trend
    indicator: ema_stack_bullish
    timeframe: "1D"
  - category: trend
    indicator: price_above_ema
    params:
      period: 50
    timeframe: "1D"
  - category: trend
    indicator: price_above_ema
    params:
      period: 200
    timeframe: "1D"
  - category: momentum
    indicator: rsi_in_range
    params:
      min: 55
      max: 80
    timeframe: "1D"
  - category: momentum
    indicator: macd_bullish
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "4h"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 25
    timeframe: "1D"
