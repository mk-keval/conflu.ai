name: "Breakout"
description: "Price breaking out with momentum and volume confirmation"
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
filters:
  - category: trend
    indicator: price_above_ema
    params:
      period: 20
    operator: gt
    timeframe: "1D"
  - category: momentum
    indicator: macd_bullish
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "4h"
