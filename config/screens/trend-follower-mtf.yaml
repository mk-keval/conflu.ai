name: "Trend Follower (Multi-Timeframe)"
description: "EMA50 above EMA200 on daily with 4h confirmation (price > EMA20, RSI>60, MACD bullish, rvol>1.5) — captures established trends with shorter-timeframe confirmation"
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
filters:
  - category: trend
    indicator: ema_stack_bullish
    timeframe: "1D"
  - category: trend
    indicator: price_above_ema
    params:
      period: 20
    timeframe: "4h"
  - category: momentum
    indicator: rsi_gt
    params:
      threshold: 60
    timeframe: "4h"
  - category: momentum
    indicator: macd_bullish
    timeframe: "4h"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "4h"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 25
    timeframe: "1D"