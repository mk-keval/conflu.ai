name: "Trend Follower (Multi-Timeframe)"
description: "EMA50 > EMA200 on daily, RSI > 60 daily, RSI > 55 weekly"
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
  - 1W
filters:
  - category: trend
    indicator: ema_cross
    params:
      fast: 50
      slow: 200
    timeframe: "1D"
  - category: momentum
    indicator: rsi_overbought
    params:
      threshold: 60
    timeframe: "1D"
  - category: momentum
    indicator: rsi_overbought
    params:
      threshold: 55
    timeframe: "1W"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.2
    timeframe: "4h"
