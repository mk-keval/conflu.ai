name: "Trend Follower (Multi-Timeframe)"
description: "EMA50 above EMA200 on daily with RSI strength and ADX confirmation — captures established trends with multi-timeframe confirmation"
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
filters:
  - category: trend
    indicator: ema_cross
    params:
      fast: 50
      slow: 200
    timeframe: "1D"
  - category: trend
    indicator: ema_stack_bullish
    timeframe: "1D"
  - category: momentum
    indicator: rsi_gt
    params:
      threshold: 55
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.0
    timeframe: "4h"
  - category: volume
    indicator: price_above_vwap
    timeframe: "1D"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 22
    timeframe: "1D"
