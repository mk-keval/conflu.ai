name: "Volatility Expansion"
description: "Stocks that experienced a Bollinger Band squeeze (low vol contraction) and are now expanding with volume and momentum. Captures the explosive expansion phase that follows coiling price action"
direction: long
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
filters:
  - category: volatility
    indicator: bb_squeeze_tight
    params:
      threshold: 1.06
    timeframe: "4h"
  - category: momentum
    indicator: rsi_in_range
    params:
      min: 60
      max: 85
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "1D"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 25
    timeframe: "1D"