name: "Volume Surge"
description: "High relative volume with momentum and trend confirmation — catching institutional volume surges in trending stocks"
direction: long
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 1h
filters:
  - category: volume
    indicator: rvol_high
    params:
      threshold: 2.0
    timeframe: "1D"
  - category: momentum
    indicator: macd_bullish
    timeframe: "1h"
  - category: trend
    indicator: price_above_ema
    params:
      period: 50
    timeframe: "1D"
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 500000000