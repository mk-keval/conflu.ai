name: "Low-Vol Setup Simple"
description: "Low volatility stocks with steady trend, tight Bollinger Bands, and neutral momentum — positioned for the next expansion"
asset_classes:
  - equities
timeframes:
  - 1D
filters:
  - category: trend
    indicator: price_above_ema
    params:
      period: 50
    timeframe: "1D"
  - category: volatility
    indicator: bb_squeeze
    params:
      threshold: 1.05
    timeframe: "1D"
  - category: momentum
    indicator: rsi_in_range
    params:
      min: 45
      max: 60
    timeframe: "1D"
  - category: volatility
    indicator: atr_pct_below
    params:
      threshold: 0.03
    timeframe: "1D"
  - category: volume
    indicator: rvol_low
    params:
      threshold: 0.8
    timeframe: "1D"
