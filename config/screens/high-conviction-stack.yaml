name: "High-Conviction Stack"
description: "Multi-factor confluence stack — every signal must fire simultaneously. Bullish EMA stack, strong momentum, elevated volume, trending ADX, and positive fundamental backdrop. Designed for high-probability, institutional-quality setups only"
direction: long
asset_classes:
  - equities
timeframes:
  - 1D
  - 4h
filters:
  - category: trend
    indicator: ema_stack_bullish
    timeframe: "1D"
  - category: trend
    indicator: price_above_ema
    params:
      period: 200
    timeframe: "1D"
  - category: momentum
    indicator: rsi_macd_bullish
    timeframe: "1D"
  - category: momentum
    indicator: rsi_in_range
    params:
      min: 55
      max: 80
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "1D"
  - category: volume
    indicator: price_above_vwap
    timeframe: "1D"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 25
    timeframe: "1D"
  - category: fundamental
    indicator: eps_positive
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 2000000000
  - category: fundamental
    indicator: analyst_rating_in
    params:
      ratings:
        - StrongBuy
        - Buy
