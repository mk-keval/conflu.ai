name: "Oversold Bounce"
description: "Deeply oversold with RSI confirmation for reversal"
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
filters:
  - category: momentum
    indicator: rsi_oversold
    params:
      threshold: 30
    timeframe: "1D"
  - category: momentum
    indicator: macd_bullish
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.2
    timeframe: "1D"
