name: "Oversold Bounce"
description: "RSI < 30 with price below lower Bollinger Band and volume confirmation — catching reversals from deeply sold-off conditions"
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
filters:
  - category: momentum
    indicator: rsi_oversold
    params:
      threshold: 30
    timeframe: "1D"
  - category: volatility
    indicator: price_below_bb_lower
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.0
    timeframe: "4h"
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 500000000