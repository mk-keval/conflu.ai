name: "Trend Follower"
description: "Uptrending assets with momentum, volume, and trend structure confirmation. Filters: $2B+ mcap, NYSE/NASDAQ, US, $5+, 1M avg vol."
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
filters:
  # Institutional quality gates
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 2000000000
    timeframe: "1D"
  - category: fundamental
    indicator: exchange_in
    params:
      exchanges:
        - "NYSE"
        - "NASDAQ"
    timeframe: "1D"
  - category: fundamental
    indicator: country_in
    params:
      countries:
        - "United States"
    timeframe: "1D"
  - category: fundamental
    indicator: close_above
    params:
      threshold: 5.0
    timeframe: "1D"
  - category: volume
    indicator: avg_volume_gt
    params:
      threshold: 1000000
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "4h"
  # Technical trend criteria
  - category: trend
    indicator: price_above_ema
    params:
      period: 200
    operator: gt
    timeframe: "1D"
  - category: trend
    indicator: ema_stack_bullish
    timeframe: "1D"
  - category: trend
    indicator: adx_trending
    params:
      threshold: 25
    timeframe: "1D"
  - category: momentum
    indicator: macd_bullish
    timeframe: "4h"
