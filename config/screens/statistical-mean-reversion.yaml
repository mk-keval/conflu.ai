name: "Statistical Mean Reversion"
description: "Oversold conditions with technical confirmation — RSI deeply oversold, CCI oversold, and volume surge suggesting exhaustion of selling pressure. Captures classic mean-reversion bounces from statistical extremes"
direction: long
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
filters:
  - category: momentum
    indicator: rsi_oversold
    params:
      threshold: 32
    timeframe: "1D"
  - category: momentum
    indicator: cci_oversold
    params:
      threshold: -100
    timeframe: "1D"
  - category: volatility
    indicator: atr_pct_below
    params:
      threshold: 0.04
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "1D"