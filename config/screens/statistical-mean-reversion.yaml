name: "Statistical Mean Reversion"
description: "Extreme oversold — statistically rare conditions where stocks have sold off far more than normal. Higher probability bounce setup than regular mean reversion. For when the market is in panic and you want to catch the snap-back."
direction: long
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
filters:
  # Institutional quality gates
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 500000000
    timeframe: "1D"
  - category: fundamental
    indicator: exchange_in
    params:
      exchanges:
        - "NYSE"
        - "NASDAQ"
    timeframe: "1D"
  - category: fundamental
    indicator: country_in
    params:
      countries:
        - "United States"
    timeframe: "1D"
  - category: fundamental
    indicator: close_above
    params:
      threshold: 5.0
    timeframe: "1D"
  - category: volume
    indicator: avg_volume_gt
    params:
      threshold: 500000
    timeframe: "1D"
  - category: volume
    indicator: volume_gt
    params:
      threshold: 500000
    timeframe: "1D"
  # Technical mean reversion criteria
  - category: momentum
    indicator: rsi_oversold
    params:
      threshold: 32
    timeframe: "1D"
  - category: momentum
    indicator: cci_oversold
    params:
      threshold: -100
    timeframe: "1D"
  - category: volatility
    indicator: atr_pct_below
    params:
      threshold: 0.04
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.2
    timeframe: "1D"
