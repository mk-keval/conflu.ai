name: "Statistical Mean Reversion"
description: "Oversold conditions with technical confirmation — RSI deeply oversold, CCI oversold, and volume surge suggesting exhaustion of selling pressure. Captures classic mean-reversion bounces from statistical extremes. Filters: $500M+ mcap, NYSE/NASDAQ, US, $5+, IPO>1yr, 30% inst ownership, 1M avg vol, 500K vol."
direction: long
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
filters:
  # Institutional quality gates
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 500000000
    timeframe: "1D"
  - category: fundamental
    indicator: exchange_in
    params:
      exchanges:
        - "NYSE"
        - "NASDAQ"
    timeframe: "1D"
  - category: fundamental
    indicator: country_in
    params:
      countries:
        - "United States"
    timeframe: "1D"
  - category: fundamental
    indicator: close_above
    params:
      threshold: 5.0
    timeframe: "1D"
  - category: volume
    indicator: avg_volume_gt
    params:
      threshold: 1000000
    timeframe: "1D"
  - category: volume
    indicator: volume_gt
    params:
      threshold: 500000
    timeframe: "1D"
  # Technical mean reversion criteria
  - category: momentum
    indicator: rsi_oversold
    params:
      threshold: 32
    timeframe: "1D"
  - category: momentum
    indicator: cci_oversold
    params:
      threshold: -100
    timeframe: "1D"
  - category: volatility
    indicator: atr_pct_below
    params:
      threshold: 0.04
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "1D"
