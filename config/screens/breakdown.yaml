name: "Breakdown"
description: "Bearish trend breakdown — price below key EMAs, bearish MACD, weak momentum, and distribution volume"
direction: short
asset_classes:
  - equities
timeframes:
  - 1D
  - 4h
filters:
  - category: trend
    indicator: price_below_ema
    params:
      period: 50
    timeframe: "1D"
  - category: trend
    indicator: price_below_ema
    params:
      period: 200
    timeframe: "1D"
  - category: trend
    indicator: ema_stack_bearish
    timeframe: "1D"
  - category: momentum
    indicator: macd_bearish
    timeframe: "1D"
  - category: momentum
    indicator: rsi_oversold
    params:
      threshold: 45
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "1D"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 25
    timeframe: "1D"
