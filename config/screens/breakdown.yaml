name: "Breakdown"
description: "Bearish trend breakdown — price below key EMAs, bearish MACD, weak momentum, and distribution volume. Filters: $500M+ mcap, NYSE/NASDAQ, US, $5+, 1M avg vol, 500K vol."
direction: short
asset_classes:
  - equities
timeframes:
  - 1D
  - 4h
filters:
  # Institutional quality gates
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 500000000
    timeframe: "1D"
  - category: fundamental
    indicator: exchange_in
    params:
      exchanges:
        - "NYSE"
        - "NASDAQ"
    timeframe: "1D"
  - category: fundamental
    indicator: country_in
    params:
      countries:
        - "United States"
    timeframe: "1D"
  - category: fundamental
    indicator: close_above
    params:
      threshold: 5.0
    timeframe: "1D"
  - category: volume
    indicator: avg_volume_gt
    params:
      threshold: 1000000
    timeframe: "1D"
  - category: volume
    indicator: volume_gt
    params:
      threshold: 500000
    timeframe: "1D"
  # Technical breakdown criteria
  - category: trend
    indicator: price_below_ema
    params:
      period: 50
    timeframe: "1D"
  - category: trend
    indicator: price_below_ema
    params:
      period: 200
    timeframe: "1D"
  - category: trend
    indicator: ema_stack_bearish
    timeframe: "1D"
  - category: momentum
    indicator: macd_bearish
    timeframe: "1D"
  - category: momentum
    indicator: rsi_oversold
    params:
      threshold: 45
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "1D"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 25
    timeframe: "1D"
