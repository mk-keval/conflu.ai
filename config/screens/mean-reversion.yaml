name: "Mean Reversion"
description: "Stocks that have dropped too far, too fast — they're deeply oversold and due for a bounce. Like a rubber band stretched too tight. Use when the market is choppy or after a panic sell-off. Not for strong trending markets."
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
filters:
  # Institutional quality gates
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 500000000
    timeframe: "1D"
  - category: fundamental
    indicator: exchange_in
    params:
      exchanges:
        - "NYSE"
        - "NASDAQ"
    timeframe: "1D"
  - category: fundamental
    indicator: country_in
    params:
      countries:
        - "United States"
    timeframe: "1D"
  - category: fundamental
    indicator: close_above
    params:
      threshold: 5.0
    timeframe: "1D"
  - category: volume
    indicator: avg_volume_gt
    params:
      threshold: 500000
    timeframe: "1D"
  - category: volume
    indicator: volume_gt
    params:
      threshold: 500000
    timeframe: "1D"
  # Technical mean reversion criteria
  - category: momentum
    indicator: rsi_oversold
    params:
      threshold: 30
    timeframe: "1D"
  - category: volatility
    indicator: price_below_bb_lower
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.0
    timeframe: "4h"
