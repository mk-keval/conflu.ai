name: "Mean Reversion"
description: "Oversold assets with RSI and volume confirmation"
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 1h
filters:
  - category: momentum
    indicator: rsi_oversold
    params:
      threshold: 30
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "1h"
