name: "Mean Reversion"
description: "Oversold with RSI < 30, price below lower Bollinger Band, and volume confirmation — catching potential bounce setups from exhausted selling. Filters: $500M+ mcap, NYSE/NASDAQ, US, $5+, IPO>1yr, 30% inst ownership, 1M avg vol, 500K vol."
asset_classes:
  - equities
  - crypto
timeframes:
  - 1D
  - 4h
filters:
  # Institutional quality gates
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 500000000
    timeframe: "1D"
  - category: fundamental
    indicator: exchange_in
    params:
      exchanges:
        - "NYSE"
        - "NASDAQ"
    timeframe: "1D"
  - category: fundamental
    indicator: country_in
    params:
      countries:
        - "United States"
    timeframe: "1D"
  - category: fundamental
    indicator: close_above
    params:
      threshold: 5.0
    timeframe: "1D"
  - category: volume
    indicator: avg_volume_gt
    params:
      threshold: 1000000
    timeframe: "1D"
  - category: volume
    indicator: volume_gt
    params:
      threshold: 500000
    timeframe: "1D"
  # Technical mean reversion criteria
  - category: momentum
    indicator: rsi_oversold
    params:
      threshold: 30
    timeframe: "1D"
  - category: volatility
    indicator: price_below_bb_lower
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.0
    timeframe: "4h"
