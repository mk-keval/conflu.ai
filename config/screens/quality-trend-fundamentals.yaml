name: "Quality Trend + Fundamentals"
description: "Quality companies with institutional-grade fundamentals showing technical strength. No earnings surprise/date data on TV."
direction: long
asset_classes:
  - equities
timeframes:
  - 1D
  - 4h
filters:
  - category: fundamental
    indicator: eps_positive
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 500000000
  - category: fundamental
    indicator: pe_max
    params:
      max_pe: 60
  - category: trend
    indicator: ema_stack_bullish
    timeframe: "1D"
  - category: momentum
    indicator: rsi_macd_bullish
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.2
    timeframe: "1D"
  - category: volume
    indicator: price_above_vwap
    timeframe: "1D"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 25
    timeframe: "1D"