name: "Volume + Trend Accumulation"
description: "OBV proxy (price > SMA20 + above-avg volume) with bullish trend structure. Note: no real 13F/insider data on TV."
direction: long
asset_classes:
  - equities
timeframes:
  - 1D
  - 4h
filters:
  - category: volume
    indicator: obv_rising
    params:
      min_rvol: 1.0
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.3
    timeframe: "1D"
  - category: volume
    indicator: price_above_vwap
    timeframe: "1D"
  - category: trend
    indicator: price_above_ema
    params:
      period: 50
    timeframe: "1D"
  - category: momentum
    indicator: rsi_in_range
    params:
      min: 55
      max: 70
    timeframe: "1D"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 25
    timeframe: "1D"
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 1000000000
  - category: fundamental
    indicator: eps_positive