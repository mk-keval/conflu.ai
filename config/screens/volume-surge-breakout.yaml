name: "Volume Surge Breakout"
description: "Price breaking above VWAP with heavy relative volume — potential momentum continuation. No short interest data available on TV."
direction: long
asset_classes:
  - equities
timeframes:
  - 1D
  - 4h
filters:
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "1D"
  - category: volume
    indicator: price_above_vwap
    timeframe: "1D"
  - category: momentum
    indicator: rsi_in_range
    params:
      min: 50
      max: 70
    timeframe: "1D"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 22
    timeframe: "1D"
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 500000000