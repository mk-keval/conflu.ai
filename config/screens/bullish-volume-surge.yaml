name: "Bullish Volume Surge"
description: "Strong buying volume — price above VWAP and EMA20 with heavy relative volume"
direction: long
asset_classes:
  - equities
timeframes:
  - 1D
  - 4h
filters:
  - category: momentum
    indicator: rsi_overbought
    params:
      threshold: 50
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "1D"
  - category: volume
    indicator: price_above_vwap
    timeframe: "1D"
  - category: trend
    indicator: price_above_ema
    params:
      period: 20
    timeframe: "1D"
