name: "Volume-Confirmed Uptrend"
description: "Strong buying volume with trend confirmation — price above VWAP and EMA20, elevated relative volume, and trending ADX. Not a volume spike; a volume-confirmed trend. Filters: $500M+ mcap, NYSE/NASDAQ, US, $5+, IPO>1yr, 30% inst ownership, 1M avg vol."
direction: long
asset_classes:
  - equities
timeframes:
  - 1D
  - 4h
filters:
  # Institutional quality gates
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 500000000
    timeframe: "1D"
  - category: fundamental
    indicator: exchange_in
    params:
      exchanges:
        - "NYSE"
        - "NASDAQ"
    timeframe: "1D"
  - category: fundamental
    indicator: country_in
    params:
      countries:
        - "United States"
    timeframe: "1D"
  - category: fundamental
    indicator: close_above
    params:
      threshold: 5.0
    timeframe: "1D"
  - category: fundamental
    indicator: eps_positive
    timeframe: "1D"
  - category: fundamental
    indicator: pe_max
    params:
      max_pe: 60
    timeframe: "1D"
  # Volume & trend confirmation
  - category: volume
    indicator: rvol_high
    params:
      threshold: 2.0
    timeframe: "1D"
  - category: volume
    indicator: price_above_vwap
    timeframe: "1D"
  - category: trend
    indicator: price_above_ema
    params:
      threshold: 55
    timeframe: "1D"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 25
    timeframe: "1D"
