name: "Volume-Confirmed Uptrend"
description: "Strong buying volume with trend confirmation — price above VWAP and EMA20, elevated relative volume, and trending ADX. Not a volume spike; a volume-confirmed trend."
direction: long
asset_classes:
  - equities
timeframes:
  - 1D
  - 4h
filters:
  - category: momentum
    indicator: rsi_gt
    params:
      threshold: 55
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 2.0
    timeframe: "1D"
  - category: volume
    indicator: price_above_vwap
    timeframe: "1D"
  - category: trend
    indicator: price_above_ema
    params:
      period: 20
    timeframe: "1D"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 25
    timeframe: "1D"