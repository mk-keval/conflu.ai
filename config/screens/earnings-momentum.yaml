name: "Earnings Momentum"
description: "Stocks with strong fundamental quality and technical momentum — positive EPS, bullish EMA stack, MACD confirming, and above-average volume. Targets quality companies with institutional-grade fundamentals that are also showing technical strength"
direction: long
asset_classes:
  - equities
timeframes:
  - 1D
  - 4h
filters:
  - category: fundamental
    indicator: eps_positive
  - category: fundamental
    indicator: market_cap_gt
    params:
      value: 1000000000
  - category: fundamental
    indicator: pe_max
    params:
      max_pe: 60
  - category: fundamental
    indicator: analyst_rating_in
    params:
      ratings:
        - StrongBuy
        - Buy
  - category: trend
    indicator: ema_stack_bullish
    timeframe: "1D"
  - category: momentum
    indicator: rsi_macd_bullish
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.2
    timeframe: "1D"
  - category: volume
    indicator: price_above_vwap
    timeframe: "1D"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 25
    timeframe: "1D"
