name: "52-Week Breakout"
description: "Stocks near 52-week highs with momentum, volume, and trend strength confirmation"
asset_classes:
  - equities
timeframes:
  - 1D
  - 4h
filters:
  - category: trend
    indicator: price_above_ema
    params:
      period: 200
    timeframe: "1D"
  - category: trend
    indicator: ema_stack_bullish
    timeframe: "1D"
  - category: momentum
    indicator: macd_bullish
    timeframe: "1D"
  - category: volume
    indicator: rvol_high
    params:
      threshold: 1.5
    timeframe: "4h"
  - category: volatility
    indicator: adx_trending
    params:
      threshold: 30
    timeframe: "1D"
  - category: trend
    indicator: vwap_band
    params:
      side: "above"
      upper: 1.02
    timeframe: "1D"