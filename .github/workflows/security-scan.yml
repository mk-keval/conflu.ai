name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --results=verified
          path: .
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  dependencies:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install uv
          uv pip install --system ".[dev,test,observability]"
          pip install pip-audit --break-system-packages
          # Starlette ignores (PYSEC-2026-161/248/249/2280/2281) removed on
          # 2026-10-19: starlette 1.9 + instrumentator 8.1 clear them for real
          # (see docs/DECISIONS/D-69).
          pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit
        working-directory: frontend
        # Remaining findings are dev-tooling majors, tracked as upgrade debt in
        # D-69: tailwind 3 chain (needs tailwind 4), react-router-dom@7,
        # lint-staged@17. Gate stays on critical so genuinely urgent advisories
        # still fail the build.
        run: npm audit --audit-level=critical

  container:
    name: Container Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -t conflu-backend:test --target runtime .
          docker build -f frontend/Dockerfile -t conflu-frontend:test ./frontend
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          scan-ref: conflu-backend:test
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL
      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          scan-ref: conflu-frontend:test
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          scan-ref: conflu-backend:test
          format: spdx-json
          output: sbom-backend.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: sbom-backend.spdx.json
