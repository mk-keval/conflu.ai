name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --results=verified
          path: .
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  dependencies:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install uv
          uv pip install --system ".[dev,test,observability]"
          pip install pip-audit --break-system-packages
          pip-audit --allow-vuln "starlette"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  container:
    name: Container Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -t conflu-backend:test --target runtime .
          docker build -f frontend/Dockerfile -t conflu-frontend:test ./frontend
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          scan-ref: conflu-backend:test
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL
      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          scan-ref: conflu-frontend:test
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          scan-ref: conflu-backend:test
          format: spdx-json
          output: sbom-backend.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: sbom-backend.spdx.json
