services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: conflu-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./config.yaml:/app/config.yaml
      - ./config/screens:/app/config/screens
    environment:
      - CONFLU_CORE__LOG_LEVEL=INFO
      - CONFLU_CORE__LOG_JSON=true
    command: >
      sh -c "python -c 'from backend.app.core.database import initialize_database; initialize_database()'
      && python -m uvicorn backend.app.api.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: conflu-worker
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./config.yaml:/app/config.yaml
      - ./config/screens:/app/config/screens
    environment:
      - CONFLU_CORE__LOG_LEVEL=INFO
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    command: >
      sh -c "python -c 'from backend.app.core.database import initialize_database; initialize_database()'
      && python -m celery -A backend.app.worker.celery_app worker --loglevel=info -Q ingestion,compute,screener"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: conflu-beat
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./config.yaml:/app/config.yaml
      - ./config/screens:/app/config/screens
    environment:
      - CONFLU_CORE__LOG_LEVEL=INFO
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    command: >
      sh -c "python -c 'from backend.app.core.database import initialize_database; initialize_database()'
      && python -m celery -A backend.app.worker.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: conflu-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: conflu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Observability (opt-in: docker compose --profile observability up)
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    container_name: conflu-prometheus
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    container_name: conflu-grafana
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
