services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: conflu-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./config.yaml:/app/config.yaml
      - ./config/screens:/app/config/screens
      - ./config/regime_screens.yaml:/app/config/regime_screens.yaml
      - ./frontend/src/content/education.json:/app/education/education.json:ro
    environment:
      - CONFLU_CORE__LOG_LEVEL=INFO
      - CONFLU_CORE__LOG_JSON=true
      - EDUCATION_CONTENT_PATH=/app/education/education.json
    command: >
      sh -c "python -c 'from backend.app.core.database import initialize_database; initialize_database()'
      && python -m uvicorn backend.app.api.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: conflu-worker
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./config.yaml:/app/config.yaml
      - ./config/screens:/app/config/screens
      - ./config/regime_screens.yaml:/app/config/regime_screens.yaml
    environment:
      - CONFLU_CORE__LOG_LEVEL=INFO
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      # Secrets passthrough (supplied from host env / .env; empty = unset)
      - CONFLU_PROFESSIONAL__SENDGRID_API_KEY=${CONFLU_PROFESSIONAL__SENDGRID_API_KEY:-}
      - CONFLU_API__API_KEYS=${CONFLU_API__API_KEYS:-}
    command: >
      sh -c "python -c 'from backend.app.core.database import initialize_database; initialize_database()'
      && python -m celery -A backend.app.worker.celery_app worker --loglevel=info -Q ingestion"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "from backend.app.worker.celery_app import celery_app; import sys; sys.exit(0 if celery_app.control.ping(timeout=5) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: conflu-beat
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./config.yaml:/app/config.yaml
      - ./config/screens:/app/config/screens
      - ./config/regime_screens.yaml:/app/config/regime_screens.yaml
    environment:
      - CONFLU_CORE__LOG_LEVEL=INFO
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      # Secrets passthrough (supplied from host env / .env; empty = unset)
      - CONFLU_PROFESSIONAL__SENDGRID_API_KEY=${CONFLU_PROFESSIONAL__SENDGRID_API_KEY:-}
      - CONFLU_API__API_KEYS=${CONFLU_API__API_KEYS:-}
    command: >
      sh -c "python -c 'from backend.app.core.database import initialize_database; initialize_database()'
      && python -m celery -A backend.app.worker.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; redis.Redis(host='redis', port=6379).ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: conflu-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: conflu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Observability (opt-in: docker compose --profile observability up)
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    container_name: conflu-prometheus
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    container_name: conflu-grafana
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      # Overridable admin password — set GRAFANA_ADMIN_PASSWORD in the host env
      # or .env; defaults to "admin" for local dev only.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
